<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRUD Hello World</title>
  <meta name="description" content="A tiny CRUD Hello World on Cloudflare Workers + Supabase." />
  <style>
    :root { color-scheme: dark; --muted: #9a9ab0; --line: #ffffff1f; --card: #ffffff0b; --accent: #f6821f; --danger: #ff6b6b; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 20% 15%, #3b1d6e 0%, transparent 45%),
                  radial-gradient(circle at 85% 85%, #0f4c75 0%, transparent 45%),
                  #0b0b14;
      background-attachment: fixed;
      color: #f4f4f8;
      padding: 4rem 1.25rem;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 {
      font-size: clamp(2.75rem, 9vw, 4.75rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      text-align: center;
      background: linear-gradient(90deg, #f6821f, #fbad41, #ff6ec7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub { margin-top: .5rem; text-align: center; color: #b8b8c8; }
    form.new { margin-top: 2.5rem; display: flex; gap: .6rem; }
    .field { position: relative; flex: 1; }
    input[type=text] {
      width: 100%;
      font: inherit;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: .8rem 4rem .8rem 1rem;
      outline: none;
      transition: border-color .15s;
    }
    input[type=text]:focus { border-color: #f6821f99; }
    .count { position: absolute; right: .9rem; top: 50%; transform: translateY(-50%); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; }
    .count.full { color: var(--accent); }
    button {
      font: inherit;
      cursor: pointer;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      color: inherit;
      padding: .55rem .9rem;
      transition: background .15s, border-color .15s, opacity .15s;
    }
    button:hover { background: #ffffff18; }
    button:disabled { opacity: .45; cursor: default; }
    button.primary { background: linear-gradient(90deg, #f6821f, #fbad41); color: #1a1022; font-weight: 700; border: none; padding: .8rem 1.3rem; }
    button.primary:hover { filter: brightness(1.07); }
    button.danger:hover { border-color: #ff6b6b88; color: var(--danger); }
    .status { min-height: 1.4rem; margin-top: .6rem; font-size: .9rem; color: var(--muted); }
    .status.error { color: var(--danger); }
    ul { list-style: none; padding: 0; margin-top: 1rem; display: grid; gap: .6rem; }
    li {
      display: flex; align-items: center; gap: .6rem;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: .7rem .7rem .7rem 1rem;
    }
    .text { flex: 1; min-width: 0; }
    .content { word-break: break-word; }
    .when { font-size: .75rem; color: var(--muted); margin-top: .15rem; }
    li .field input { padding: .55rem 3.6rem .55rem .8rem; border-radius: 10px; }
    li button { padding: .45rem .75rem; font-size: .85rem; border-radius: 10px; }
    .empty { text-align: center; color: var(--muted); padding: 1.5rem 0; }
    footer { margin-top: 2.5rem; text-align: center; font-size: .8rem; color: #6f6f86; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World!</h1>
    <p class="sub">Save a message (up to 40 characters). It's stored in Supabase.</p>

    <form class="new" id="new-form" autocomplete="off">
      <div class="field">
        <input type="text" id="new-input" maxlength="40" placeholder="Type something…" aria-label="New message" required />
        <span class="count" id="new-count">0/40</span>
      </div>
      <button class="primary" type="submit" id="save-btn">Save</button>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <ul id="list" aria-label="Saved messages"></ul>

    <footer>Cloudflare Workers + Supabase · auto-deployed from GitHub</footer>
  </main>

  <script>
    const MAX = 40;
    const $ = (id) => document.getElementById(id);
    const list = $("list"), statusEl = $("status");
    const len = (s) => [...s].length;

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg || "";
      statusEl.classList.toggle("error", isError);
    }

    function bindCounter(input, counter) {
      const update = () => {
        const n = len(input.value);
        counter.textContent = n + "/" + MAX;
        counter.classList.toggle("full", n >= MAX);
      };
      input.addEventListener("input", update);
      update();
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: options.body ? { "content-type": "application/json" } : {},
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Something went wrong");
      return data;
    }

    const fmt = (iso) => new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });

    function el(tag, props = {}, children = []) {
      const node = Object.assign(document.createElement(tag), props);
      for (const c of children) node.append(c);
      return node;
    }

    function renderItem(msg) {
      const li = el("li");
      li.dataset.id = msg.id;
      const showView = () => {
        li.replaceChildren(
          el("div", { className: "text" }, [
            el("div", { className: "content", textContent: msg.content }),
            el("div", { className: "when", textContent: fmt(msg.created_at) }),
          ]),
          el("button", { type: "button", textContent: "Edit", onclick: showEdit }),
          el("button", { type: "button", className: "danger", textContent: "Delete", onclick: remove }),
        );
      };
      const showEdit = () => {
        const input = el("input", { type: "text", maxLength: MAX, value: msg.content, ariaLabel: "Edit message" });
        const counter = el("span", { className: "count" });
        const form = el("form", { className: "text", onsubmit: save }, [el("div", { className: "field" }, [input, counter])]);
        bindCounter(input, counter);
        li.replaceChildren(
          form,
          el("button", { type: "button", className: "primary", textContent: "Save", onclick: () => form.requestSubmit() }),
          el("button", { type: "button", textContent: "Cancel", onclick: showView }),
        );
        input.addEventListener("keydown", (e) => { if (e.key === "Escape") showView(); });
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);

        async function save(e) {
          e.preventDefault();
          const content = input.value.trim();
          if (!content) return setStatus("Message can't be empty", true);
          if (content === msg.content) return showView();
          try {
            msg = await api("/api/messages/" + msg.id, { method: "PUT", body: JSON.stringify({ content }) });
            showView();
            setStatus("Updated.");
          } catch (err) { setStatus(err.message, true); }
        }
      };
      async function remove() {
        li.querySelectorAll("button").forEach((b) => (b.disabled = true));
        try {
          await api("/api/messages/" + msg.id, { method: "DELETE" });
          li.remove();
          if (!list.children.length) renderEmpty();
          setStatus("Deleted.");
        } catch (err) {
          setStatus(err.message, true);
          li.querySelectorAll("button").forEach((b) => (b.disabled = false));
        }
      }
      showView();
      return li;
    }

    function renderEmpty() {
      list.replaceChildren(el("li", { className: "empty", textContent: "No messages yet. Save your first one above." }));
    }

    async function load() {
      try {
        const rows = await api("/api/messages");
        if (!rows.length) return renderEmpty();
        list.replaceChildren(...rows.map(renderItem));
      } catch (err) { setStatus(err.message, true); }
    }

    const input = $("new-input"), saveBtn = $("save-btn");
    bindCounter(input, $("new-count"));

    $("new-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const content = input.value.trim();
      if (!content) return setStatus("Message can't be empty", true);
      if (len(content) > MAX) return setStatus("Message must be 40 characters or fewer", true);
      saveBtn.disabled = true;
      try {
        const msg = await api("/api/messages", { method: "POST", body: JSON.stringify({ content }) });
        if (list.querySelector(".empty")) list.replaceChildren();
        list.prepend(renderItem(msg));
        input.value = "";
        input.dispatchEvent(new Event("input"));
        setStatus("Saved.");
      } catch (err) { setStatus(err.message, true); }
      finally { saveBtn.disabled = false; input.focus(); }
    });

    load();
  </script>
</body>
</html>
